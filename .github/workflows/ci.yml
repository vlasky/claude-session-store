name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck -x bin/session-set bin/session-get bin/session-del \
            bin/session-incr bin/session-decr bin/session-keys bin/session-list \
            hooks/session-start hooks/session-end hooks/subagent-start \
            tests/run-tests.sh
          shellcheck -s bash bin/_session-lock

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: ./tests/run-tests.sh

      - name: Run tests (perl lock path)
        run: SESSION_STORE_NO_FLOCK=1 ./tests/run-tests.sh

      # macOS ships bash 3.2 as /bin/bash; the tools' `#!/usr/bin/env bash`
      # must work there. Constrain PATH so `env bash` resolves to it.
      - name: Run tests (bash 3.2)
        if: runner.os == 'macOS'
        run: |
          JQDIR="$(dirname "$(command -v jq)")"
          env PATH="/bin:/usr/bin:/usr/sbin:/sbin:$JQDIR" ./tests/run-tests.sh
